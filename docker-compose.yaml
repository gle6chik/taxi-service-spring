services:
  postgres:
    image: postgres:15
    container_name: taxi-db
    environment:
      POSTGRES_DB: taxi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taxi-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
